name: Share Code Regression
on:
  push:
    paths:
      - 'share-codes.js'
      - 'app.js'
      - 'index.html'
      - 'service-worker.js'
      - 'data/attachments.js'
      - 'data/attachments.json'
      - 'data/weapons.js'
      - 'tests/test_share_codes.js'
      - 'tests/test_movement_lab_v19.py'
      - 'tests/test_multi_apex_v191.py'
      - 'ui-v9.css'
      - 'ui-v10.css'
      - 'refresh-settings.js'
      - 'tests/test_upgrade_phases.py'
      - 'RELEASE_NOTES.md'
      - '.github/workflows/share-code-tests.yml'
  pull_request:
    paths:
      - 'share-codes.js'
      - 'app.js'
      - 'index.html'
      - 'service-worker.js'
      - 'data/attachments.js'
      - 'data/attachments.json'
      - 'data/weapons.js'
      - 'tests/test_share_codes.js'
      - 'tests/test_movement_lab_v19.py'
      - 'tests/test_multi_apex_v191.py'
      - 'ui-v9.css'
      - 'ui-v10.css'
      - 'refresh-settings.js'
      - 'tests/test_upgrade_phases.py'
      - 'RELEASE_NOTES.md'
permissions:
  contents: read
jobs:
  verify-sharing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python regression dependencies
        run: python3 -m pip install beautifulsoup4==4.12.3 markdown==3.9 pytest
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check share-codes.js
      - name: Check all application JavaScript syntax
        run: |
          for file in app.js share-codes.js refresh-settings.js ui-experience.js service-worker.js; do node --check "$file"; done
      - name: Full Python regression suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify earlier reliability checks
        run: python3 -m pytest tests/test_reliability_v161.py -q
      - name: Test website share codes and game-code separation
        run: node tests/test_share_codes.js
      - name: Validate movement lab and measured-data safeguards
        run: python3 -m unittest discover -s tests -p 'test_movement_lab_v19.py'
      - name: Validate all Apex options and catalog parity
        run: python3 -m unittest discover -s tests -p 'test_multi_apex_v191.py'
