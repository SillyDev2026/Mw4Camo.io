name: Sync MW4 attachment catalog
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-attachments.yml"
      - "scripts/sync_attachments.py"
  schedule:
    - cron: "43 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mw4-arsenal-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and validate catalog
        run: python scripts/sync_attachments.py
      - name: Test inventory
        run: python -m unittest discover -s tests -p 'test_arsenal_v17.py'
      - name: Commit updated attachment snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/attachments-community.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh reported MW4 attachment inventory"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
